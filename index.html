document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0 auto\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#8fd6c2;margin-bottom:28px\">International Conference on Ethics and AI<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(38px,5.8vw,76px);line-height:1.06;letter-spacing:-0.01em;max-width:16ch;text-wrap:balance\">Artificial Intelligence and Peacebuilding<\u002Fh1>\n      <p style=\"margin:26px 0 0;max-width:62ch;font-size:clamp(17px,1.5vw,21px);line-height:1.55;color:#cfd8d2;text-wrap:pretty\">Ethics, Law, Communication and International Relations in a Changing World.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:44px\">\n        <div style=\"padding:18px 22px;border:1px solid rgba(246,244,239,0.16);border-radius:4px;background:rgba(246,244,239,0.05)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#9fb0a7\">Venue<\u002Fdiv>\n          <div style=\"margin-top:7px;font-size:16px;color:#f6f4ef;max-width:30ch\">Faculty of Philosophy, University of Seville — Seville, Spain<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px;border:1px solid rgba(246,244,239,0.16);border-radius:4px;background:rgba(246,244,239,0.05)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#9fb0a7\">Online sessions<\u002Fdiv>\n          <div style=\"margin-top:7px;font-size:16px;color:#f6f4ef\">10 December 2026<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px;border:1px solid rgba(246,244,239,0.16);border-radius:4px;background:rgba(246,244,239,0.05)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#9fb0a7\">In-person sessions<\u002Fdiv>\n          <div style=\"margin-top:7px;font-size:16px;color:#f6f4ef\">11 December 2026<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px;border:1px solid rgba(143,214,194,0.45);border-radius:4px;background:rgba(143,214,194,0.12)\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#8fd6c2\">Registration fee<\u002Fdiv>\n          <div style=\"margin-top:7px;font-size:16px;color:#f6f4ef\">€100<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:40px\">\n        <a href=\"#call\" style=\"display:inline-block;padding:15px 30px;background:#8fd6c2;color:#121b17;border-radius:999px;font-weight:600;font-size:15px;letter-spacing:0.02em\" style-hover=\"background:#b6e8da;color:#121b17\">Submit a proposal<\u002Fa>\n        <a href=\"#themes\" style=\"display:inline-block;padding:15px 30px;border:1px solid rgba(246,244,239,0.35);color:#f6f4ef;border-radius:999px;font-weight:500;font-size:15px\" style-hover=\"border-color:#f6f4ef\">See thematic areas<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:34px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;color:#9fb0a7\">Deadline for proposals: 31 October 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"padding:96px 32px;border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">01 — About<\u002Fdiv>\n        <h2 style=\"margin:18px 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;letter-spacing:-0.01em;color:#16211c;text-wrap:balance\">Rethinking Peacebuilding in the Age of Artificial Intelligence<\u002Fh2>\n        <blockquote style=\"margin:34px 0 0;padding:22px 26px;border-left:2px solid #1f6f5c;background:rgba(31,111,92,0.06);font-family:Newsreader,Georgia,serif;font-style:italic;font-size:22px;line-height:1.4;color:#16211c\">“Si vis pacem, para reconciliationem.”<span style=\"display:block;margin-top:10px;font-family:Barlow,sans-serif;font-style:normal;font-size:14px;color:#40514a\">A shift away from <i>si vis pacem, para bellum<\u002Fi>: sustainable peace requires reconciliation, social cohesion, mutual recognition and the reconstruction of relationships fractured by conflict.<\u002Fspan><\u002Fblockquote>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px;font-size:16.5px;line-height:1.65;color:#40514a\">\n        <p style=\"margin:0;text-wrap:pretty\">Artificial Intelligence is rapidly transforming the conditions under which individuals, societies and states communicate, interact and make decisions. Its growing presence in public discourse, political processes, diplomacy, security and international relations raises fundamental questions about the future of conflict and peacebuilding.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\">Generative AI, algorithmic communication, synthetic media and increasingly autonomous systems create new possibilities for cooperation and dialogue, while introducing significant risks: disinformation, manipulation, polarization, erosion of trust, technological asymmetries and new forms of conflict.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\">The Symposium invites critical reflection on the anthropological dimension of technological transformation, and on how religious, philosophical and post-secular perspectives contribute to the ethical debate on AI and peaceful coexistence.<\u002Fp>\n        <p style=\"margin:0;padding-top:20px;border-top:1px solid rgba(22,33,28,0.14);font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.35;color:#16211c\">AI can become an instrument of division — or an instrument of reconciliation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showQuestionBanner }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"padding:80px 32px;background:linear-gradient(180deg,rgba(31,111,92,0.07),transparent);border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1000px;margin:0 auto;text-align:center\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">The central question<\u002Fdiv>\n      <p style=\"margin:24px 0 0;font-family:Newsreader,Georgia,serif;font-size:clamp(26px,3.4vw,40px);line-height:1.25;color:#16211c;text-wrap:balance\">How can societies govern Artificial Intelligence in ways that contribute to peace, reconciliation and human coexistence rather than intensifying conflict and division?<\u002Fp>\n      <p style=\"margin:26px auto 0;max-width:70ch;font-size:16px;line-height:1.6;color:#6b7a72\">An interdisciplinary dialogue between ethics, law, communication, international relations, political science, social anthropology, philosophy, theology and technology studies.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"themes\" style=\"padding:96px 32px;border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">02 — Thematic areas<\u002Fdiv>\n      <h2 style=\"margin:18px 0 48px;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:#16211c\">Six lines of inquiry<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1px;background:rgba(22,33,28,0.14);border:1px solid rgba(22,33,28,0.14)\">\n        <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <article style=\"padding:34px 30px;background:#f6f4ef;display:flex;flex-direction:column;gap:14px\" style-hover=\"background:#efece4\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1f6f5c\">{{ t.num }}<\u002Fdiv>\n            <h3 style=\"margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:26px;line-height:1.2;color:#16211c\">{{ t.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#40514a;text-wrap:pretty\">{{ t.body }}<\u002Fp>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"call\" style=\"padding:96px 32px;border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:56px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">03 — Call for contributions<\u002Fdiv>\n        <h2 style=\"margin:18px 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:#16211c\">Submit your work<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:16.5px;line-height:1.65;color:#40514a;text-wrap:pretty\">We welcome original papers, theoretical contributions, empirical research, case studies and interdisciplinary approaches addressing the themes of the Symposium — from established scholars, early-career and doctoral researchers, and interdisciplinary collaborations.<\u002Fp>\n        <div style=\"margin-top:32px;padding:24px;border:1px solid rgba(22,33,28,0.14);border-radius:4px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#6b7a72\">How to submit<\u002Fdiv>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#40514a\">Send your proposal to <a href=\"mailto:gestionescongreso@gmail.com\">gestionescongreso@gmail.com<\u002Fa> before 31 October 2026. Acceptance decisions are communicated within five days of submission.<\u002Fp>\n          <a href=\"mailto:gestionescongreso@gmail.com\" style=\"align-self:flex-start;margin-top:6px;padding:13px 26px;background:#1f6f5c;color:#f6f4ef;border-radius:999px;font-weight:600;font-size:14.5px\" style-hover=\"background:#12483c;color:#f6f4ef\">Send a proposal<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#6b7a72;margin-bottom:18px\">We particularly encourage contributions that<\u002Fdiv>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px;background:rgba(22,33,28,0.14);border-top:1px solid rgba(22,33,28,0.14);border-bottom:1px solid rgba(22,33,28,0.14)\">\n          <sc-for list=\"{{ encouraged }}\" as=\"e\" hint-placeholder-count=\"7\">\n            <li style=\"display:flex;gap:16px;padding:16px 4px;background:#f6f4ef;font-size:15.5px;line-height:1.55;color:#40514a\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1f6f5c;padding-top:3px\">→<\u002Fspan>\n              <span>{{ e }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"dates\" style=\"padding:96px 32px 104px;background:radial-gradient(900px 420px at 80% 10%, rgba(45,122,103,0.35), transparent 65%),#121b17;color:#f6f4ef;border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#8fd6c2\">04 — Key dates<\u002Fdiv>\n          <h2 style=\"margin:18px 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:#f6f4ef\">Calendar<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#9fb0a7\">Oct → Dec 2026<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,108px),1fr));gap:36px 18px\">\n        <sc-for list=\"{{ dates }}\" as=\"d\" hint-placeholder-count=\"5\">\n          <div style=\"position:relative;padding:0 0 4px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:0\">\n            <div style=\"position:relative;height:36px;display:flex;align-items:center\">\n              <div style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(246,244,239,0.22)\"><\u002Fdiv>\n              <div style=\"position:relative;width:13px;height:13px;border-radius:50%;background:#8fd6c2;box-shadow:0 0 0 6px rgba(143,214,194,0.16)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 0 0\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#9fb0a7\">Step {{ d.step }}<\u002Fdiv>\n              <div style=\"margin-top:12px;font-family:Newsreader,Georgia,serif;font-size:clamp(28px,2.8vw,38px);line-height:1;color:#8fd6c2\">{{ d.day }}<\u002Fdiv>\n              <div style=\"margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#f6f4ef\">{{ d.month }}<\u002Fdiv>\n              <div style=\"margin-top:16px;font-size:17px;line-height:1.4;color:#f6f4ef;text-wrap:pretty;max-width:22ch\">{{ d.what }}<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:14.5px;line-height:1.5;color:#9fb0a7;max-width:24ch\">{{ d.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"committees\" style=\"padding:96px 32px;border-bottom:1px solid rgba(22,33,28,0.1)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">05 — Organization<\u002Fdiv>\n      <h2 style=\"margin:18px 0 48px;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:#16211c\">Committees<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#6b7a72;padding-bottom:16px;border-bottom:1px solid rgba(22,33,28,0.14)\">Organizing Committee<\u002Fdiv>\n          <sc-for list=\"{{ organizing }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"padding:18px 0;border-bottom:1px solid rgba(22,33,28,0.08)\">\n              <div style=\"font-size:18px;color:#16211c\">{{ p.name }}<\u002Fdiv>\n              <div style=\"margin-top:4px;font-size:14.5px;color:#6b7a72\">{{ p.org }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#6b7a72;padding-bottom:16px;border-bottom:1px solid rgba(22,33,28,0.14)\">Scientific Committee<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 40px\">\n            <sc-for list=\"{{ scientific }}\" as=\"p\" hint-placeholder-count=\"10\">\n              <div style=\"padding:18px 0;border-bottom:1px solid rgba(22,33,28,0.08)\">\n                <div style=\"font-size:18px;color:#16211c\">{{ p.name }}<\u002Fdiv>\n                <div style=\"margin-top:4px;font-size:14.5px;color:#6b7a72\">{{ p.org }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" style=\"padding:96px 32px\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;align-items:start\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#1f6f5c\">06 — Registration &amp; contact<\u002Fdiv>\n        <h2 style=\"margin:18px 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:#16211c\">Join the conversation<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:16.5px;line-height:1.65;color:#40514a;max-width:48ch\">Registration fee €100. Registration period 1–15 November 2026. The final conference programme is published on 20 November 2026.<\u002Fp>\n        <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:8px;font-size:16px;color:#40514a\">\n          <div>Organizer: <span style=\"color:#16211c\">University of Seville<\u002Fspan><\u002Fdiv>\n          <div>Contact: <a href=\"mailto:gestionescongreso@gmail.com\">gestionescongreso@gmail.com<\u002Fa><\u002Fdiv>\n          <div>Faculty of Philosophy, University of Seville — Seville, Spain<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:34px;border:1px solid rgba(31,111,92,0.35);border-radius:4px;background:rgba(31,111,92,0.06)\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#1f6f5c\">Registration<\u002Fdiv>\n        <div style=\"margin:14px 0 0;font-family:Newsreader,Georgia,serif;font-size:56px;line-height:1;color:#16211c\">€100<\u002Fdiv>\n        <ul style=\"margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.55;color:#40514a\">\n          <li>Access to online sessions — 10 December 2026<\u002Fli>\n          <li>Access to in-person sessions — 11 December 2026<\u002Fli>\n          <li>Presentation and discussion of an accepted paper<\u002Fli>\n        <\u002Ful>\n        <a href=\"mailto:gestionescongreso@gmail.com?subject=Ethics%26AI%202026%20—%20Registration\" style=\"display:inline-block;margin-top:26px;padding:14px 28px;background:#1f6f5c;color:#f6f4ef;border-radius:999px;font-weight:600;font-size:15px\" style-hover=\"background:#12483c;color:#f6f4ef\">Register by email<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:44px 32px;border-top:1px solid rgba(246,244,239,0.12);background:#121b17\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;font-size:14px;color:#9fb0a7\">\n      <div style=\"display:flex;align-items:center;gap:10px;white-space:nowrap\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#f6f4ef;flex:none\">\n          <img src=\"82e00600-034a-4d18-b06c-12add7023b39\" alt=\"\" style=\"width:30px;height:30px;display:block\">\n        <\u002Fspan>\n        <span style=\"font-family:Newsreader,Georgia,serif;font-size:22px;line-height:1;color:#f6f4ef\">Ethics<span style=\"color:#8fd6c2\">&amp;<\u002Fspan>AI<\u002Fspan>\n      <\u002Fdiv>\n      <div>International Conference on Ethics and AI · University of Seville<\u002Fdiv>\n      <a href=\"mailto:gestionescongreso@gmail.com\" style=\"color:#8fd6c2\" style-hover=\"color:#b6e8da\">gestionescongreso@gmail.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showQuestionBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showQuestionBanner: this.props.showQuestionBanner ?? true,\n      themes: [\n        { num: \"01\", title: \"Artificial Intelligence, Conflict and Peacebuilding\", body: \"AI and the changing nature of conflict; AI-enabled warfare and information warfare; autonomous systems; algorithmic polarization; conflict prevention; mediation; reconciliation; and the possibilities and limits of AI-assisted peacebuilding.\" },\n        { num: \"02\", title: \"Ethics, Law and the Governance of Artificial Intelligence\", body: \"Ethical and legal frameworks for AI; accountability and responsibility; transparency and explainability; human rights; human dignity; democratic oversight; international regulation; and the challenges of governing AI across jurisdictions.\" },\n        { num: \"03\", title: \"AI, Communication, Disinformation and Political Narratives\", body: \"Generative AI, synthetic media, deepfakes, misinformation and propaganda; algorithmic influence on public opinion; collective narratives; historical memory and grievances; hate speech; and the potential of AI to facilitate dialogue and intercultural understanding.\" },\n        { num: \"04\", title: \"Artificial Intelligence, International Relations and Global Governance\", body: \"AI and the transformation of diplomacy, international institutions and global power relations; technological sovereignty; geopolitical competition; democratic governance; inequality; and the implications of AI for the international order.\" },\n        { num: \"05\", title: \"AI, Human Anthropology, Religion and the Post-Secular Society\", body: \"AI and the transformation of human identity, agency and social relationships; anthropological approaches to technological change; religion and spirituality in the public sphere; natural theology; post-secularism; and religious and non-religious contributions to social cohesion.\" },\n        { num: \"06\", title: \"AI, Migration, Civil Society and Social Reconciliation\", body: \"AI, migration and demographic transformation; technology and social inclusion; civil society and civic engagement; intercultural relations; local knowledge; gender and peacebuilding; and AI in support of dialogue and reconciliation in divided societies.\" }\n      ],\n      encouraged: [\n        \"Develop new theoretical approaches to AI and peacebuilding\",\n        \"Examine concrete cases involving AI, conflict, communication or international relations\",\n        \"Address the ethical and legal challenges of AI governance\",\n        \"Explore AI's impact on diplomacy, international communication and global governance\",\n        \"Examine the relationship between technology, identity, memory and reconciliation\",\n        \"Offer anthropological, philosophical, theological or sociological perspectives on AI and human coexistence\",\n        \"Propose innovative approaches to using AI in conflict prevention, mediation and peacebuilding\"\n      ],\n      dates: [\n        { step: \"01\", day: \"31\", month: \"October 2026\", what: \"Deadline for submitting proposals\", note: \"Decisions within five days of submission\" },\n        { step: \"02\", day: \"1–15\", month: \"November 2026\", what: \"Registration period\", note: \"Fee €100\" },\n        { step: \"03\", day: \"20\", month: \"November 2026\", what: \"Final conference programme published\", note: \"\" },\n        { step: \"04\", day: \"10\", month: \"December 2026\", what: \"Online sessions\", note: \"Live, remote participation\" },\n        { step: \"05\", day: \"11\", month: \"December 2026\", what: \"In-person sessions\", note: \"Faculty of Philosophy, Seville\" }\n      ],\n      organizing: [\n        { name: \"Juan Carlos Suárez Villegas\", org: \"University of Seville\" },\n        { name: \"Basilio Monteiro\", org: \"St. John's University\" }\n      ],\n      scientific: [\n        { name: \"Thomas Bauer\", org: \"University of Vienna\" },\n        { name: \"Danijela Milic\", org: \"International Organization for Migration, Switzerland\" },\n        { name: \"Arturo Pagan\", org: \"UNFPA, United Nations\" },\n        { name: \"Naqib Noory\", org: \"UNFPA, United Nations\" },\n        { name: \"Dan Peterson\", org: \"Swedish Police Authority, Sweden\" },\n        { name: \"Gad Karmi\", org: \"St. John's University, New York\" },\n        { name: \"Afua Ankhara\", org: \"St. John's University, New York\" },\n        { name: \"Desislava Stoiva\", org: \"St. John's University, New York\" },\n        { name: \"Jewel Antoine\", org: \"Foundation for a Just Society, New York\" },\n        { name: \"Liliette Mathias\", org: \"Polytechnic University of Leiria, Portugal\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
